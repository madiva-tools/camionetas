<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1A5FA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MADIVA Camionetas">
<link rel="manifest" href="manifest.json">
<title>MADIVA — Control Camionetas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#F0F4F8;color:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;padding-bottom:72px}

/* HEADER */
header{background:#1A5FA8;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(26,95,168,.35)}
header h1{font-size:17px;font-weight:700;color:#fff}
header p{font-size:11px;color:rgba(255,255,255,.65);margin-top:1px}

/* TABS */
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.tab{flex:1;padding:10px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;color:#94a3b8;font-size:10px;font-weight:600;transition:color .15s}
.tab.active{color:#1A5FA8}
.tab.active-prob{color:#d9534f}
.tab svg{width:22px;height:22px}

/* PAGES */
.page{display:none;padding:16px;max-width:480px;width:100%;margin:0 auto;flex-direction:column;gap:12px}
.page.active{display:flex}

/* CARDS */
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.04)}

label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:7px}

input[type=text],input[type=number],textarea,select{
  width:100%;background:#F8FAFC;border:1.5px solid #e2e8f0;border-radius:10px;
  color:#1a1a2e;font-size:16px;padding:12px 14px;outline:none;
  transition:border-color .2s;-webkit-appearance:none
}
input:focus,textarea:focus,select:focus{border-color:#1A5FA8;background:#fff}
textarea{resize:none;height:76px;font-family:inherit}

.sel-wrap{position:relative}
.sel-wrap select{padding-right:36px;cursor:pointer}
.sel-wrap::after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:#94a3b8;font-size:13px}

/* KM */
input.km{font-size:26px;font-weight:700;text-align:center;letter-spacing:1px;color:#1A5FA8}

/* Combustible */
.comb-wrap{display:flex;flex-direction:column;gap:8px}
.comb-val{text-align:center;font-size:28px;font-weight:700;color:#1A5FA8}
.comb-slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,#1A5FA8 var(--pct,50%),#e2e8f0 var(--pct,50%));outline:none;cursor:pointer}
.comb-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#1A5FA8;border:3px solid #fff;box-shadow:0 2px 6px rgba(26,95,168,.4)}

/* Fotos */
.fotos-grid{display:grid;gap:10px}
.fotos-grid.one{grid-template-columns:1fr}
.fotos-grid.three{grid-template-columns:repeat(3,1fr)}
.foto-slot{border:2px dashed #cbd5e1;border-radius:10px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s;background:#F8FAFC}
.foto-slot:active{border-color:#1A5FA8}
.foto-slot.one{min-height:150px}
.foto-slot input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.foto-slot svg{opacity:.3;width:26px;height:26px;color:#1a1a2e}
.foto-slot p{font-size:11px;color:#94a3b8;text-align:center;line-height:1.4}
.foto-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-badge{position:absolute;bottom:4px;right:4px;background:rgba(26,95,168,.85);color:#fff;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700}

/* Botones */
.btn{border:none;color:#fff;width:100%;padding:16px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .1s;background:#1A5FA8}
.btn:active{opacity:.85;transform:scale(.98)}
.btn.loading{opacity:.55;pointer-events:none}
.btn.danger{background:#d9534f}
.btn.danger:active{opacity:.85}

.required{color:#d9534f;margin-left:2px}
.opt{color:#94a3b8;font-size:9px;font-weight:400;margin-left:4px}

/* HISTORIAL */
.filtros{display:flex;gap:8px;align-items:center}
.filtros select{flex:1;font-size:13px;padding:10px 12px}
.btn-refresh{background:#fff;border:1.5px solid #e2e8f0;color:#64748b;border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn-refresh:active{background:#F0F4F8}

.hist-list{display:flex;flex-direction:column;gap:10px}
.hist-item{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #1A5FA8}
.hist-item.problema{border-left-color:#d9534f}
.hist-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-tipo{font-size:11px;font-weight:700;color:#1A5FA8}
.hist-tipo.p{color:#d9534f}
.hist-fecha{font-size:11px;color:#94a3b8}
.hist-nombre{font-size:14px;font-weight:700;margin-bottom:3px;color:#1a1a2e}
.hist-detalle{font-size:12px;color:#64748b;display:flex;gap:12px;flex-wrap:wrap}
.hist-obs{font-size:12px;color:#64748b;margin-top:5px;font-style:italic}
.hist-empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:14px}

/* Toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1a9e5c;color:#fff;padding:12px 24px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.18);white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#d9534f}
</style>
</head>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbww5_9dM2XcsLWs8tnLychdUQbYr75RtcUwUS6LLNc9cEYnW15zKVMzinXyOfyQPqTTZQ/exec";

// Navegación
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.classList.remove('active-prob'); });
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add(id === 'prob' ? 'active-prob' : 'active');
  if (id === 'hist') cargarHistorial();
}

// Toast
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err ? ' err' : '');
  void t.offsetWidth; // fuerza reflow para que la animación arranque
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.classList.remove('show'); }, 3000);
}

// Combustible slider
const sliderKm = document.getElementById('km-comb');
const valKm = document.getElementById('km-combval');
sliderKm.addEventListener('input', function() {
  valKm.textContent = this.value;
  this.style.setProperty('--pct', this.value + '%');
});

// Foto KM
let fotoKm = null;
document.getElementById('km-foto-input').addEventListener('change', function(e) {
  comprimirFoto(e.target.files[0], 800, function(b64) {
    fotoKm = b64;
    const slot = document.getElementById('km-foto-slot');
    slot.innerHTML = `<img src="${b64}"><span class="foto-badge">📷</span>`;
  });
});

// Fotos Problema
let fotosProb = [null, null, null];
function cargarFotoProb(input, idx) {
  comprimirFoto(input.files[0], 600, function(b64) {
    fotosProb[idx] = b64;
    const slot = document.getElementById('pr-slot-' + idx);
    slot.innerHTML = `<img src="${b64}"><span class="foto-badge">📷</span>`;
  });
}

// Comprimir foto
function comprimirFoto(file, maxPx, cb) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > h && w > maxPx) { h = h * maxPx / w; w = maxPx; }
      else if (h > maxPx) { w = w * maxPx / h; h = maxPx; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// Enviar KM
async function enviarKm() {
  const nombre = document.getElementById('km-nombre').value;
  const matricula = document.getElementById('km-matricula').value;
  const km = document.getElementById('km-km').value;
  const combustible = document.getElementById('km-comb').value;
  const obs = document.getElementById('km-obs').value;

  if (!nombre) { toast('⚠️ Seleccioná tu nombre', true); return; }
  if (!matricula) { toast('⚠️ Seleccioná la matrícula', true); return; }
  if (!km) { toast('⚠️ Ingresá el kilometraje', true); return; }
  if (!fotoKm) { toast('⚠️ Sacá la foto del tablero', true); return; }

  const btn = document.getElementById('km-btn');
  btn.classList.add('loading'); btn.textContent = 'Enviando...';

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ tipo: 'km', nombre, matricula, km, combustible, observaciones: obs, foto: fotoKm })
    });
    const d = await res.json();
    if (d.ok) {
      toast('✅ Reporte de km enviado');
      document.getElementById('km-nombre').value = '';
      document.getElementById('km-matricula').value = '';
      document.getElementById('km-km').value = '';
      document.getElementById('km-obs').value = '';
      sliderKm.value = 50; valKm.textContent = '50'; sliderKm.style.setProperty('--pct','50%');
      fotoKm = null;
      document.getElementById('km-foto-slot').innerHTML = `<input type="file" id="km-foto-input" accept="image/*" capture="environment"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><p>Tocá para sacar<br>foto del tablero</p>`;
      document.getElementById('km-foto-input').addEventListener('change', function(e){ comprimirFoto(e.target.files[0],800,function(b64){fotoKm=b64;const s=document.getElementById('km-foto-slot');s.innerHTML=`<img src="${b64}"><span class="foto-badge">📷</span>`;}); });
    } else { toast('❌ Error al enviar', true); }
  } catch(e) { toast('❌ Sin conexión', true); }

  btn.classList.remove('loading');
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar reporte de km';
}

// Enviar Problema
async function enviarProblema() {
  const nombre = document.getElementById('pr-nombre').value;
  const matricula = document.getElementById('pr-matricula').value;
  const obs = document.getElementById('pr-obs').value.trim();

  if (!nombre) { toast('⚠️ Seleccioná tu nombre', true); return; }
  if (!matricula) { toast('⚠️ Seleccioná la matrícula', true); return; }
  if (!obs) { toast('⚠️ Describí el problema', true); return; }

  const btn = document.getElementById('pr-btn');
  btn.classList.add('loading'); btn.textContent = 'Enviando...';

  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ tipo: 'problema', nombre, matricula, observaciones: obs, foto1: fotosProb[0], foto2: fotosProb[1], foto3: fotosProb[2] })
    });
    const d = await res.json();
    if (d.ok) {
      toast('✅ Problema reportado');
      document.getElementById('pr-nombre').value = '';
      document.getElementById('pr-matricula').value = '';
      document.getElementById('pr-obs').value = '';
      fotosProb = [null,null,null];
      [0,1,2].forEach(i => {
        document.getElementById('pr-slot-'+i).innerHTML = `<input type="file" accept="image/*" capture="environment" onchange="cargarFotoProb(this,${i})"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><p>Foto ${i+1}</p>`;
      });
    } else { toast('❌ Error al enviar', true); }
  } catch(e) { toast('❌ Sin conexión', true); }

  btn.classList.remove('loading');
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Reportar problema';
}

// HISTORIAL
let todosRegistros = [];

async function cargarHistorial() {
  document.getElementById('hist-list').innerHTML = '<div class="hist-empty">Cargando...</div>';
  try {
    const res = await fetch(SCRIPT_URL + '?action=historial');
    const d = await res.json();
    if (d.ok) {
      todosRegistros = d.data;
      filtrar();
    } else {
      document.getElementById('hist-list').innerHTML = '<div class="hist-empty">Error al cargar datos</div>';
    }
  } catch(e) {
    document.getElementById('hist-list').innerHTML = '<div class="hist-empty">Sin conexión</div>';
  }
}

function filtrar() {
  const chofer = document.getElementById('f-chofer').value;
  const mat = document.getElementById('f-mat').value;
  let lista = todosRegistros;
  if (chofer) lista = lista.filter(r => r.nombre === chofer);
  if (mat) lista = lista.filter(r => r.matricula === mat);

  const el = document.getElementById('hist-list');
  if (!lista.length) { el.innerHTML = '<div class="hist-empty">Sin registros para ese filtro</div>'; return; }

  el.innerHTML = lista.slice(0,50).map(r => {
    const esProb = r.tipo === 'problema';
    return `<div class="hist-item ${esProb ? 'problema' : ''}">
      <div class="hist-meta">
        <span class="hist-tipo ${esProb ? 'p' : ''}">${esProb ? '⚠️ Problema' : '🚛 KM'}</span>
        <span class="hist-fecha">${r.fecha} ${r.hora}</span>
      </div>
      <div class="hist-nombre">${r.nombre}</div>
      <div class="hist-detalle">
        <span>🚗 ${r.matricula}</span>
        ${!esProb ? `<span>📍 ${r.km} km</span><span>⛽ ${r.combustible}%</span>` : ''}
      </div>
      ${r.observaciones ? `<div class="hist-obs">${r.observaciones}</div>` : ''}
    </div>`;
  }).join('');
}
</script>
